require:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Metrics/MethodLength:
  Exclude:
    - "lib/blazer/querygen/configuration.rb"
    - "lib/blazer/querygen/prompt_builder.rb"
    - "lib/blazer/querygen/ai_client.rb"
    - "lib/blazer/querygen/schema_extractor.rb"
    - "lib/blazer/querygen/query_generator.rb"
    - "app/controllers/**/*"

Metrics/ClassLength:
  Exclude:
    - "test/**/*"
    - "lib/blazer/querygen/schema_extractor.rb"

Metrics/AbcSize:
  Exclude:
    - "lib/blazer/querygen/prompt_builder.rb"
    - "app/controllers/**/*"

Metrics/CyclomaticComplexity:
  Exclude:
    - "lib/blazer/querygen/prompt_builder.rb"

Metrics/PerceivedComplexity:
  Exclude:
    - "lib/blazer/querygen/prompt_builder.rb"

Metrics/BlockLength:
  Exclude:
    - "lib/blazer/querygen/ai_client.rb"
    - "test/**/*"
    - "blazer-querygen.gemspec"

Style/ClassAndModuleChildren:
  Exclude:
    - "test/**/*"

Minitest/MultipleAssertions:
  Max: 10
